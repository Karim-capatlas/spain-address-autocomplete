<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>address-search-es Widget Example</title>
  <script type="module">
    import { defineCustomElement } from '../packages/widget/dist/components/address-search-es.js';
    defineCustomElement();
  </script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 1rem; }
    address-search-es { width: 100%; }
    .log { font-size: 0.85rem; color: #64748b; margin-top: 1rem; }
    .mode { font-size: 0.85rem; margin-bottom: 1.5rem; padding: 0.75rem 1rem; border-radius: 8px; }
    .mode.dev { background: #fef9c3; color: #713f12; }
    .mode.prod { background: #dcfce7; color: #14532d; }
    code { background: rgba(0,0,0,0.06); padding: 0.1em 0.35em; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Spanish Address Autocomplete</h1>

  <!--
    ┌─────────────────────────────────────────────────────────────────────────┐
    │ PRODUCTION (recommended): proxy mode — no credentials in the client.    │
    │                                                                         │
    │   <address-search-es endpoint="/api/address-search"></address-search-es>│
    │                                                                         │
    │ Run the BFF proxy with:                                                 │
    │   pnpm --filter @spain-address/proxy start                              │
    │ (Typesense host/port/api-key are read from env vars server-side.)       │
    └─────────────────────────────────────────────────────────────────────────┘

    The example below uses DIRECT mode for convenience only — it only works
    against a local typesense-server and MUST NOT be used in production:
    anyone can read the API key from the page source.
  -->
  <div class="mode dev">
    ⚠️ <b>Direct dev mode</b> — Typesense credentials are visible in the client.
    For production use <code>endpoint="/api/address-search"</code> (proxy mode).
  </div>

  <address-search-es
    typesense-host="127.0.0.1"
    typesense-port="8108"
    typesense-api-key="xyz"
    typesense-protocol="http"
    placeholder="Buscar calle, municipio o código postal…"
  ></address-search-es>
  <div class="log" id="log">Escribe una dirección…</div>
  <script>
    const widget = document.querySelector('address-search-es');
    widget.addEventListener('addressSelected', (e) => {
      document.getElementById('log').textContent = 'Seleccionado: ' + JSON.stringify(e.detail);
    });
    widget.addEventListener('error', (e) => {
      document.getElementById('log').textContent = 'Error: ' + e.detail.message;
    });
  </script>
</body>
</html>
