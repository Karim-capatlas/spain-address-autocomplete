# Local search backend (Typesense) for Phase 3.5+.
#
# A single shared Typesense instance backs BOTH the street index (`callejero_es`,
# 749,261 docs) and the cascade dropdown index (`cascade_es`, ~18,285 docs). It
# is the same engine used on the VPS, so local behaviour matches production.
#
# Local dev note: on macOS the author runs Typesense via Homebrew instead
# (`brew services start typesense-server@30.2`, api-key `xyz`, 127.0.0.1:8108).
# This compose file is the Linux/VPS equivalent — use whichever you prefer; the
# client (`packages/core`) only needs TYPESENSE_HOST/PORT/API_KEY.
#
# Usage:
#   docker compose up -d typesense          # start the shared TypesSense backend
#   pnpm typesense:import -- --snapshot packages/data/snapshots/callejero_2026-01.jsonl.gz --drop
#   pnpm cascade:import  -- --snapshot packages/data/snapshots/callejero_2026-01.jsonl.gz --drop
#   pnpm -F @spain-address/cascade start  # cascade BFF (port 5978, reads typesense on localhost)
#   pnpm -F @spain-address/proxy start     # search BFF

services:
  typesense:
    image: typesense/typesense:30.2           # matches the brew dev version; pin as needed
    container_name: typesense
    restart: unless-stopped
    ports:
      - '127.0.0.1:8108:8108'
    volumes:
      - typesense-data:/data
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=xyz        # dev key; override in prod
      - TYPESENSE_ENABLE_CORS=true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8108/health']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  typesense-data:
