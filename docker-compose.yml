# Local search backend for Phase 3.5 (Upstash Redis Search migration).
#
# `redis-stack-server` ships the RediSearch module — the same engine Upstash
# Cloud runs — so the local index behaves identically to production.
#
# Usage:
#   docker-compose up -d redisearch        # start the shared RediSearch
#   pnpm cascade:import -- --snapshot packages/data/snapshots/callejero_2026-01.jsonl.gz --drop
#   docker-compose up -d cascade         # start the cascade server (port 3001)
#
# Note: this machine has the legacy `docker-compose` binary (no `docker compose`
# v2 plugin) — use `docker-compose`, not `docker compose`.

services:
  redisearch:
    image: redis/redis-stack-server:latest
    container_name: redisearch
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisearch-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 10s
      timeout: 3s
      retries: 5

  cascade:
    build: ./packages/cascade
    container_name: cascade
    restart: unless-stopped
    ports:
      - '3001:5978'
    environment:
      CASCADE_REDIS_URL: redis://redisearch:6379
    depends_on:
      redisearch:
        condition: service_healthy

volumes:
  redisearch-data:
